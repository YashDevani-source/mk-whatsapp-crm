name: mk-whatsapp-crm

# Development and test infrastructure. Databases: crm_dev (development) and crm_test (tests).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_dev
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/01-create-test-db.sql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U crm -d crm_dev && psql -U crm -d crm_dev -c "select 1" >/dev/null',
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

configs:
  create-test-db:
    content: |
      CREATE DATABASE crm_test OWNER crm;

volumes:
  postgres-data:
